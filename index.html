<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradeTracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">GradeTracker</div>
      <ul>
        <li><a href="#addGrade">Add Grade</a></li>
        <li><a href="#viewGrades">View Grades</a></li>
        <li><a href="#summary">Summary</a></li>
        <li><a href="backend/logout.php">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="addGrade" class="section">
      <h2>Add Grade</h2>
      <form id="addGradeForm">
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="e.g. Math" required>
        </div>
        <div class="form-group">
          <label for="assessment">Assessment Name</label>
          <input type="text" id="assessment" name="assessment" placeholder="e.g. Midterm Exam" required>
        </div>
        <div class="form-group">
          <label for="mark">Mark</label>
          <input type="number" id="mark" name="mark" placeholder="e.g. 8.5" min="0" step="any" required>
        </div>
        <div class="form-group">
          <label for="total">Total</label>
          <input type="number" id="total" name="total" placeholder="e.g. 10" min="0.01" step="any" required>
        </div>
        <button type="submit" class="btn">Add Grade</button>
        <p id="formMessage" aria-live="polite"></p>
      </form>
    </section>

    <div class="dashboard">

      <section id="viewGrades" class="section dark">
        <h2>Grade Records</h2>
        <nav class="filter-nav" aria-label="Filter grades">
          <label for="subjectFilter">Filter by subject:</label>
          <select id="subjectFilter">
            <option value="all">All Subjects</option>
          </select>
        </nav>
        <table id="gradesTable" class="grades-table">
          <caption>All grade entries for the current semester</caption>
          <thead>
            <tr>
              <th data-col="subject" class="sortable">Subject ↕</th>
              <th data-col="assessment" class="sortable">Assessment ↕</th>
              <th data-col="mark" class="sortable">Mark ↕</th>
              <th data-col="total" class="sortable">Total ↕</th>
              <th data-col="percent" class="sortable">% ↕</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="gradesBody"></tbody>
        </table>
      </section>

      <aside id="summary" class="section summary-sidebar">
        <h2>Subject Summary</h2>
        <div id="summaryCards" class="cards"></div>
        <blockquote id="gpaDisplay" class="gpa-block" aria-live="polite">
          Overall Average: —
        </blockquote>
      </aside>

    </div>

    <section class="section">
      <h2>Performance Chart</h2>
      <canvas id="gradesChart" role="img" aria-label="Bar chart of average grades per subject"></canvas>
    </section>

  </main>

  <dialog id="editModal" aria-labelledby="editModalTitle">
    <h3 id="editModalTitle">Edit Grade</h3>
    <form id="editForm">
      <input type="hidden" id="editId" name="id">
      <div class="form-group">
        <label for="editSubject">Subject</label>
        <input type="text" id="editSubject" name="subject" required>
      </div>
      <div class="form-group">
        <label for="editAssessment">Assessment</label>
        <input type="text" id="editAssessment" name="assessment" required>
      </div>
      <div class="form-group">
        <label for="editMark">Mark</label>
        <input type="number" id="editMark" name="mark" min="0" step="any" required>
      </div>
      <div class="form-group">
        <label for="editTotal">Total</label>
        <input type="number" id="editTotal" name="total" min="0.01" step="any" required>
      </div>
      <button type="submit" class="btn">Save Changes</button>
      <button type="button" class="btn delete-btn" id="closeModal">Cancel</button>
    </form>
  </dialog>

  <footer>
    <p>&copy; 2026 GradeTracker | All Rights Reserved</p>
  </footer>

</body>
</html>
